<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Timer</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    margin: 0;
    padding: 40px;
  }

  h1 {
    font-size: 40px;
  }

  .section {
    margin: 20px 0;
  }

  button {
    padding: 10px 16px;
    margin: 6px;
    font-size: 14px;
    cursor: pointer;
  }

  .selected {
    background: #4caf50;
    color: black;
  }

  #timer {
    font-size: 80px;
    margin: 20px 0;
  }

  #finishMessage {
    font-size: 40px;
    color: #ff5252;
    display: none;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>Study Timer</h1>
<p>Pick a category, then start the timer.</p>

<!-- CATEGORY -->
<div class="section">
  <button onclick="selectCategory('Maths')" class="selected">Maths</button>
  <button onclick="selectCategory('English')">English</button>
  <button onclick="selectCategory('Science')">Science</button>
  <button onclick="selectCategory('History')">History</button>
  <button onclick="selectCategory('Other')">Other</button>
</div>

<p>Current category: <strong id="currentCategory">Maths</strong></p>

<!-- TIMER DISPLAY -->
<div id="timer">25:00</div>

<!-- TIMER TYPES -->
<div class="section">
  <button onclick="setTimerType('work')" class="selected">Work</button>
  <button onclick="setTimerType('short')">Short Break</button>
  <button onclick="setTimerType('long')">Long Break</button>
</div>

<!-- CONTROLS -->
<div class="section">
  <button onclick="startTimer()">Start</button>
  <button onclick="pauseTimer()">Pause</button>
  <button onclick="resetTimer()">Reset</button>
</div>

<div id="finishMessage">Time’s up!</div>

<script>
  let timerInterval = null;
  let running = false;

  const times = {
    work: 25 * 60,
    short: 5 * 60,
    long: 15 * 60
  };

  let currentType = 'work';
  let timeLeft = times.work;

  function updateDisplay() {
    let m = Math.floor(timeLeft / 60);
    let s = timeLeft % 60;
    document.getElementById('timer').textContent =
      `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function selectCategory(cat) {
    document.getElementById('currentCategory').textContent = cat;

    document.querySelectorAll('.section button').forEach(b => {
      if (['Maths','English','Science','History','Other'].includes(b.textContent)) {
        b.classList.remove('selected');
      }
    });

    event.target.classList.add('selected');
  }

  function setTimerType(type) {
    resetTimer();
    currentType = type;
    timeLeft = times[type];
    updateDisplay();

    document.querySelectorAll('.section button').forEach(b => {
      if (['Work','Short Break','Long Break'].includes(b.textContent)) {
        b.classList.remove('selected');
      }
    });

    event.target.classList.add('selected');
  }

  function startTimer() {
    if (running) return;

    running = true;
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateDisplay();
      } else {
        clearInterval(timerInterval);
        running = false;
        document.getElementById('finishMessage').style.display = 'block';
      }
    }, 1000);
  }

  function pauseTimer() {
    if (!running) return;
    clearInterval(timerInterval);
    running = false;
  }

  function resetTimer() {
    clearInterval(timerInterval);
    running = false;
    timeLeft = times[currentType];
    updateDisplay();
    document.getElementById('finishMessage').style.display = 'none';
  }

  updateDisplay();
</script>

</body>
</html>
